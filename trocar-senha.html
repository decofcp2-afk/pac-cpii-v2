<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar Senha — PAC CPII</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-box">
  <div class="login-logo">
    <div style="width:64px;height:64px;background:var(--azul);border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:700">CP</div>
  </div>
  <h1>Criar senha</h1>
  <p class="subtitle" id="msg-boas-vindas">Bem-vindo(a) ao PAC CPII. Crie uma senha para continuar.</p>

  <div id="alerta-erro" class="alert alert-danger" style="display:none"></div>

  <form id="form-senha" novalidate style="margin-top:8px">
    <div class="form-group" style="margin-bottom:14px">
      <label for="nova-senha">Nova senha</label>
      <input type="password" id="nova-senha" placeholder="Mínimo 8 caracteres, 1 maiúscula, 1 número" required>
      <span class="field-error" id="nova-senha-err" style="display:none"></span>
    </div>

    <div class="form-group" style="margin-bottom:20px">
      <label for="conf-senha">Confirme a nova senha</label>
      <input type="password" id="conf-senha" placeholder="Repita a senha" required>
      <span class="field-error" id="conf-senha-err" style="display:none"></span>
    </div>

    <button type="submit" class="btn btn-primary" id="btn-salvar">Salvar senha e entrar</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script src="ui.js"></script>
<script>
(async function () {
  const session = await getSession();
  if (!session) { location.href = 'login.html'; return; }

  let perfil;
  try { perfil = await getMeuPerfil(); } catch { location.href = 'login.html'; return; }

  // Se não é primeiro acesso, redirecionar para home
  if (!perfil.primeiro_acesso) {
    location.href = HOME_POR_PAPEL[perfil.papel] || 'dashboard.html';
    return;
  }

  document.getElementById('msg-boas-vindas').textContent =
    'Bem-vindo(a), ' + perfil.nome + '. Por segurança, crie uma senha pessoal para continuar.';

  function validarSenha(s) {
    if (s.length < 8) return 'Mínimo de 8 caracteres.';
    if (!/[A-Z]/.test(s)) return 'Deve conter ao menos 1 letra maiúscula.';
    if (!/[0-9]/.test(s)) return 'Deve conter ao menos 1 número.';
    return '';
  }

  document.getElementById('form-senha').addEventListener('submit', async function (e) {
    e.preventDefault();
    const nova = document.getElementById('nova-senha').value;
    const conf = document.getElementById('conf-senha').value;
    const btn  = document.getElementById('btn-salvar');
    const erro = document.getElementById('alerta-erro');
    let ok = true;

    const errNova = validarSenha(nova);
    document.getElementById('nova-senha-err').textContent = errNova;
    document.getElementById('nova-senha-err').style.display = errNova ? '' : 'none';
    document.getElementById('nova-senha').classList.toggle('error', !!errNova);
    if (errNova) ok = false;

    if (nova !== conf) {
      document.getElementById('conf-senha-err').textContent = 'As senhas não coincidem.';
      document.getElementById('conf-senha-err').style.display = '';
      document.getElementById('conf-senha').classList.add('error');
      ok = false;
    } else {
      document.getElementById('conf-senha-err').style.display = 'none';
      document.getElementById('conf-senha').classList.remove('error');
    }

    if (!ok) return;

    setLoading(btn, true);
    erro.style.display = 'none';

    try {
      await updatePassword(nova);
      await marcarPrimeiroAcessoConcluido(perfil.id);
      location.href = HOME_POR_PAPEL[perfil.papel] || 'dashboard.html';
    } catch (err) {
      setLoading(btn, false);
      erro.textContent = 'Erro ao salvar senha: ' + (err.message || 'tente novamente.');
      erro.style.display = '';
    }
  });
})();
</script>
</body>
</html>
